# Builds the plugin for the reMarkable Paper Pro ("ferrari", 64-bit ARM) with
# reMarkable's official SDK for software 3.29.1.0, on GitHub's free runners.
#
# Two downloads appear on each run's page (see docs/paper-pro/BUILD.md):
#   ink-diary-stage1-test   the Stage 1 test: button + two screenshots, no Claude
#                           requests (docs/paper-pro/STAGE1.md)
#   ink-diary-paper-pro     the full plugin; untested on a tablet until Stage 2
# Each is a folder to copy to the tablet as it is; install.sh checks its SHA256SUMS.
name: Paper Pro build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: paper-pro-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # From https://developer.remarkable.com/links (software 3.29.1.0, ferrari,
  # x86_64 host). The checksum was taken from the downloaded file; Google
  # Storage's own MD5 for it (y9aKNrbQC0RbOmMGXZbwtQ==) matched.
  RM_SOFTWARE: 3.29.1.0
  SDK_URL: https://storage.googleapis.com/remarkable-codex-toolchain/3.29.1.0/remarkable-production-image-6.0.112-ferrari-public-x86_64-toolchain.sh
  SDK_SHA256: e517362f102f77e0b140c0ed53a74bea8a3e6fe4048199ea44df7d9af2683ebb
  # asivery/xovi, pinned so a change upstream can't silently change the build.
  XOVI_COMMIT: 2b99649f5e4fd6288be7792a8570bd16418adb70

jobs:
  ferrari:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore the SDK download
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/sdk-download
          key: rm-sdk-${{ env.SDK_SHA256 }}

      - name: Download the SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/sdk-download
          curl --fail --location --retry 3 --silent --show-error \
            "$SDK_URL" --output ~/sdk-download/sdk.sh

      - name: Check and install the SDK
        run: |
          echo "$SDK_SHA256  $HOME/sdk-download/sdk.sh" | sha256sum --check
          sh ~/sdk-download/sdk.sh -y -d "$RUNNER_TEMP/sdk" > "$RUNNER_TEMP/sdk-install.log"
          env_file=$(find "$RUNNER_TEMP/sdk" -maxdepth 1 -name 'environment-setup-*' -type f -print -quit)
          test -n "$env_file"
          echo "SDK_ENV=$env_file" >> "$GITHUB_ENV"
          echo "SDK environment: $env_file"

      - name: Fetch xovi
        run: |
          git init -q "$RUNNER_TEMP/xovi"
          git -C "$RUNNER_TEMP/xovi" fetch -q --depth 1 https://github.com/asivery/xovi "$XOVI_COMMIT"
          git -C "$RUNNER_TEMP/xovi" checkout -q FETCH_HEAD
          echo "XOVI_REPO=$RUNNER_TEMP/xovi" >> "$GITHUB_ENV"

      - name: Build the full plugin
        run: ./build.sh ferrari

      - name: Build the Stage 1 test
        run: ./build.sh ferrari-stage1

      - name: Describe and package the builds
        run: |
          set +u; source "$SDK_ENV"; set -u
          qt=$(pkg-config --modversion Qt6Core)
          echo "### Paper Pro builds ($RM_SOFTWARE, Qt $qt)" >> "$GITHUB_STEP_SUMMARY"
          for target in ferrari-stage1 ferrari; do
            file "bin/$target/ink-diary.so" "bin/$target/config-model"
            {
              if [ "$target" = ferrari-stage1 ]; then
                echo "Ink Diary for Claude, Paper Pro STAGE 1 TEST build: button and screenshots only."
              else
                echo "Ink Diary for Claude, Paper Pro full build. Untested on a tablet until Stage 2."
              fi
              echo
              echo "tablet software: $RM_SOFTWARE (ferrari, aarch64)"
              echo "Qt:              $qt"
              echo "commit:          $GITHUB_SHA"
              echo "sdk sha256:      $SDK_SHA256"
              echo "xovi commit:     $XOVI_COMMIT"
              echo
              (cd "bin/$target" && sha256sum ink-diary.so config-model)
            } | tee "bin/$target/BUILD-INFO.txt"
            tools/paper-pro/package.sh "$target"
            {
              echo
              echo "**$target**"
              echo '```'
              (cd "bin/$target" && sha256sum ink-diary.so config-model)
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload the Stage 1 test
        uses: actions/upload-artifact@v4
        with:
          name: ink-diary-stage1-test
          path: dist/ink-diary-stage1-test/
          if-no-files-found: error
          retention-days: 90

      - name: Upload the full plugin
        uses: actions/upload-artifact@v4
        with:
          name: ink-diary-paper-pro-untested
          path: dist/ink-diary-paper-pro/
          if-no-files-found: error
          retention-days: 90

  host-tests:
    # The parts that don't need the tablet: layout, button position, toolbar hiding,
    # answer rendering, placement maths and settings. Ubuntu's Qt is older than the
    # tablet's, which is fine for these checks.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qt6-base-dev qt6-declarative-dev qt6-svg-dev \
            qml6-module-qtquick qml6-module-qtqml-workerscript fonts-dejavu-core locales
          sudo locale-gen en_US.UTF-8
      - name: Run the tests
        run: ./test.sh
      - name: Check the name-map checker
        run: python3 tests/check-hashtab.py
